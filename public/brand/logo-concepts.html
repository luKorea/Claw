<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claw Logo Concepts</title>
    <style>
      :root {
        color-scheme: light;
        --primary: #044ae9;
        --soft: #f4f8ff;
        --soft-2: #eaf2ff;
        --ink: #0b1220;
        --muted: #44617f;
        --border: #d7e6ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #ffffff;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      main {
        width: min(1180px, calc(100vw - 48px));
        margin: 0 auto;
        padding: 40px 0 56px;
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.1;
        letter-spacing: 0;
      }
      .meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }
      .swatches {
        display: flex;
        gap: 8px;
      }
      .swatch {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid var(--border);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 16px;
        border-bottom: 1px solid var(--border);
      }
      h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }
      .tag {
        color: var(--primary);
        font-size: 12px;
        font-weight: 700;
      }
      .stage {
        display: grid;
        place-items: center;
        min-height: 280px;
        background:
          linear-gradient(135deg, rgba(4, 74, 233, 0.06), transparent 42%),
          var(--soft);
      }
      .stage img {
        width: 196px;
        height: 196px;
      }
      .sizes {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 18px;
        border-top: 1px solid var(--border);
      }
      .sizes img:nth-child(1) {
        width: 128px;
        height: 128px;
      }
      .sizes img:nth-child(2) {
        width: 64px;
        height: 64px;
      }
      .sizes img:nth-child(3) {
        width: 32px;
        height: 32px;
      }
      .wordmark {
        padding: 18px;
        background: #fff;
        border-top: 1px solid var(--border);
      }
      .wordmark img {
        width: 100%;
        height: auto;
        display: block;
      }
      .mono-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 13px;
      }
      .mono-row img {
        width: 48px;
        height: 48px;
      }
      @media (max-width: 980px) {
        .grid {
          grid-template-columns: 1fr;
        }
        header {
          align-items: start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Claw Logo Concepts</h1>
          <div class="meta">Cursor-style minimal marks, no literal claw, brand color #044AE9.</div>
        </div>
        <div class="swatches" aria-label="Palette">
          <span class="swatch" style="background: #044ae9"></span>
          <span class="swatch" style="background: #eaf2ff"></span>
          <span class="swatch" style="background: #f4f8ff"></span>
          <span class="swatch" style="background: #0b1220"></span>
        </div>
      </header>

      <section class="grid">
        <article class="card">
          <div class="card-head">
            <h2>Command C</h2>
            <span class="tag">A</span>
          </div>
          <div class="stage">
            <img src="./claw-command-c-icon.svg" alt="Command C app icon" />
          </div>
          <div class="sizes">
            <img src="./claw-command-c-icon.svg" alt="" />
            <img src="./claw-command-c-icon.svg" alt="" />
            <img src="./claw-command-c-icon.svg" alt="" />
          </div>
          <div class="wordmark">
            <img src="./claw-command-c-wordmark.svg" alt="Command C wordmark" />
          </div>
          <div class="mono-row">
            <span>Mono mark</span>
            <img src="./claw-command-c-mono.svg" alt="Command C mono mark" />
          </div>
        </article>

        <article class="card">
          <div class="card-head">
            <h2>Provider Stack</h2>
            <span class="tag">B</span>
          </div>
          <div class="stage">
            <img src="./claw-provider-stack-icon.svg" alt="Provider Stack app icon" />
          </div>
          <div class="sizes">
            <img src="./claw-provider-stack-icon.svg" alt="" />
            <img src="./claw-provider-stack-icon.svg" alt="" />
            <img src="./claw-provider-stack-icon.svg" alt="" />
          </div>
          <div class="wordmark">
            <img src="./claw-provider-stack-wordmark.svg" alt="Provider Stack wordmark" />
          </div>
          <div class="mono-row">
            <span>Mono mark</span>
            <img src="./claw-provider-stack-mono.svg" alt="Provider Stack mono mark" />
          </div>
        </article>

        <article class="card">
          <div class="card-head">
            <h2>Local Agent</h2>
            <span class="tag">C</span>
          </div>
          <div class="stage">
            <img src="./claw-local-agent-icon.svg" alt="Local Agent app icon" />
          </div>
          <div class="sizes">
            <img src="./claw-local-agent-icon.svg" alt="" />
            <img src="./claw-local-agent-icon.svg" alt="" />
            <img src="./claw-local-agent-icon.svg" alt="" />
          </div>
          <div class="wordmark">
            <img src="./claw-local-agent-wordmark.svg" alt="Local Agent wordmark" />
          </div>
          <div class="mono-row">
            <span>Mono mark</span>
            <img src="./claw-local-agent-mono.svg" alt="Local Agent mono mark" />
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
