[package]
name = "claw-client"
version = "0.1.3"
description = "Multi-provider AI Desktop Client"
authors = ["you"]
edition = "2021"
rust-version = "1.77"
default-run = "claw-client"
autobins = false

[[bin]]
name = "claw-client"
path = "src/main.rs"

[lib]
name = "claw_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "rt", "fs", "macros", "process", "time", "io-util"] }
# v1.3 bug fix:keyring 默认不带任何 platform feature,fallback 到 MockPlatform
# → macOS Keychain 真实不可用,set_password 后 get_password 拿不到,debug 日志输出 MockCredential
# 显式启用四平台同步后端:apple-native / sync-secret-service / windows-native / linux-native
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native", "linux-native"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid", "json"] }
log = "0.4"
tauri-plugin-log = "2"
dirs = "5"
# v1.2 Bug 3.2:动态 /v1/models 拉取。用 rustls-tls 避免 macOS 上 native-tls link 问题
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
